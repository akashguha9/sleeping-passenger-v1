name: e2e

# Playwright owner-auth + advisory-flow E2E (route-mocked, hermetic).
#
# Safety doctrine — this workflow:
#   * Must NOT reference broker execution, order placement, or trading.
#   * Must NOT require .env, GitHub Secrets, or a live backend — every
#     spec stubs the API via page.route, and any token used is a
#     synthetic per-run fixture generated inside the job.
#   * Runs on manual dispatch + a weekly schedule (browser download makes
#     it too heavy for every push; the vitest/typecheck/build job in
#     pytest.yml stays the per-push frontend gate).

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 2" # Tuesday 07:23 UTC

# Least-privilege token: read-only contents.
permissions:
  contents: read

jobs:
  playwright:
    name: playwright e2e (owner-auth + advisory flow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version (cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (cached across runs)
        run: npx playwright install --with-deps chromium
      - name: Build production frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Run Playwright specs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: npm run test:e2e
