name: dep-audit

# S10 fix: dependency vulnerability scanning in CI.  Fails on any
# High/Critical vulnerability for either the Python or Node surface.
# Runs on every push, every PR, and weekly to catch newly-disclosed
# advisories against pinned versions.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "37 6 * * 1" # Monday 06:37 UTC

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit
      - name: Audit production dependencies
        # --strict fails the run on any vulnerability that has a fix
        # available.  Vulns with no fix are surfaced but don't break CI.
        run: pip-audit -r requirements.txt --strict

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --omit=dev
      - name: npm audit (production)
        # --audit-level=high fails on High/Critical only; Moderate is
        # surfaced in the log without breaking the build.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    # D3 fix: scan the repo for committed secrets on every push.
    #
    # Why the gitleaks CLI instead of gitleaks/gitleaks-action@v2: the
    # action calls the GitHub Users API at runtime to decide whether a
    # commercial license key is required, and a transient API/JSON error
    # has failed this job before with "missing gitleaks license". A
    # merge-blocking secret gate must be deterministic, so we download
    # the open-source CLI directly, pinned by version AND SHA-256
    # (verified offline below). This keeps the exact scan command, scope
    # (--log-opts=-1 = the pushed commit), strict exit-code behavior, and
    # SARIF artifact the action produced — with no license/API dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-fixture hygiene lint (early guard, not a gitleaks substitute)
        # Fails fast on scanner-bait fixtures (fake keys beside credential
        # keywords) with a fix-it message; see scripts/secret_fixture_lint.py.
        run: python3 scripts/secret_fixture_lint.py
      - name: Install gitleaks 8.24.3 (version + checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # SHA-256 from the v8.24.3 release checksums file; a tampered or
          # repointed download fails the job here.
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks full-tree scan (defense in depth)
        # The commit-scope scan below only sees lines added in the pushed
        # commit, so bait or leaks already in the tree would go unnoticed
        # until edited. This pass scans the checked-out tree as files.
        # Report goes outside the workspace so the commit scan below never
        # re-scans scanner output.
        run: |
          gitleaks detect --no-git --config=.gitleaks.toml --redact \
            --exit-code=2 --report-format=sarif \
            --report-path=/tmp/results-tree.sarif --source=.
      - name: Gitleaks commit scan (pushed commit; real leaks exit non-zero)
        # Same command gitleaks-action@v2 ran (scope preserved:
        # --log-opts=-1 scans the pushed commit). --config is explicit so
        # .gitleaks.toml discovery is deterministic, not accidental.
        run: |
          gitleaks detect --config=.gitleaks.toml --redact -v --exit-code=2 \
            --report-format=sarif --report-path=results.sarif \
            --log-level=debug --log-opts=-1
      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-results
          path: |
            results.sarif
            /tmp/results-tree.sarif
          if-no-files-found: ignore
      - name: Build security evidence bundle
        # Machine-readable record of what this job verified (exit codes +
        # SHA-256 of every security-relevant file). --skip-pytest because
        # test deps are not installed here; the bundle records that check
        # as "skipped", never as passed (pytest has its own workflow).
        # --allow-skips tolerates exactly that deliberate skip; any FAILED
        # check still exits non-zero and fails this job.
        run: |
          python3 scripts/build_security_evidence_bundle.py \
            --skip-pytest --allow-skips
      - name: Upload security evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-bundle
          path: runtime/reports/security_evidence_bundle.json
          if-no-files-found: ignore

  policy:
    # Pass-2 supply-chain / data-protection policy gates. Stdlib-only
    # scripts — no dependency install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Actions SHA-pinning audit
        run: python scripts/audit_github_actions_pinning.py
      - name: Security-gate integrity audit (gitleaks pipeline cannot drift)
        run: python scripts/audit_security_gate_integrity.py
      - name: Dependency advisory register audit (review-window expiry)
        run: python scripts/audit_dependency_advisory_register.py
      - name: Local data-protection audit (tracked secrets/DBs/backups)
        run: python scripts/audit_local_data_protection.py
      - name: GitHub owner-controls audit (read-only; fails only on VERIFIED-unsafe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_github_owner_controls.py
      - name: Model readiness gate (advisory-only model-quality controls)
        run: python scripts/run_model_readiness_gate.py
