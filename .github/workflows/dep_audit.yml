name: dep-audit

# S10 fix: dependency vulnerability scanning in CI.  Fails on any
# High/Critical vulnerability for either the Python or Node surface.
# Runs on every push, every PR, and weekly to catch newly-disclosed
# advisories against pinned versions.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "37 6 * * 1" # Monday 06:37 UTC

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install --no-cache-dir pip-audit
      - name: Audit production dependencies
        # --strict fails the run on any vulnerability that has a fix
        # available.  Vulns with no fix are surfaced but don't break CI.
        run: pip-audit -r requirements.txt --strict

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --omit=dev
      - name: npm audit (production)
        # --audit-level=high fails on High/Critical only; Moderate is
        # surfaced in the log without breaking the build.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    # D3 fix: scan the repo for committed secrets on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    # Pass-2 supply-chain / data-protection policy gates. Stdlib-only
    # scripts — no dependency install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Actions SHA-pinning audit
        run: python scripts/audit_github_actions_pinning.py
      - name: Dependency advisory register audit (review-window expiry)
        run: python scripts/audit_dependency_advisory_register.py
      - name: Local data-protection audit (tracked secrets/DBs/backups)
        run: python scripts/audit_local_data_protection.py
      - name: GitHub owner-controls audit (read-only; fails only on VERIFIED-unsafe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_github_owner_controls.py
      - name: Model readiness gate (advisory-only model-quality controls)
        run: python scripts/run_model_readiness_gate.py
