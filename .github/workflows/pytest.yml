name: pytest

# Private-operator CI for the Sleeping Passenger MVP.
#
# Safety doctrine — every job:
#   * Must NOT reference broker execution, order placement, or trading.
#   * Must NOT require .env, secrets, or live network refresh.
#   * Must NOT run `python scripts/refresh_live_signals.py --write`.
#   * Runs read-only checks on a clean checkout with no local DB.

on:
  push:
  pull_request:

# Least-privilege token: every job only reads repo contents.  No job may
# write to the repo, packages, or deployments.
permissions:
  contents: read

jobs:
  test:
    name: backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile repo
        run: python -m compileall scripts tests
      - name: Run tests
        run: python -m pytest tests -q

  safety-floor:
    # Focused, fast, no-DB safety subset.  This runs even if the full
    # pytest job is slow so the no-execution / scope / hygiene guards
    # are always proven on push.
    name: safety floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile scripts
        run: python -m compileall scripts -q
      - name: Run safety + scope + hygiene tests
        run: |
          python -m pytest -q \
            tests/test_frontend_no_execution_language.py \
            tests/test_private_scope_guard.py \
            tests/test_api_token_gate_contract.py \
            tests/test_calibration_gate.py \
            tests/test_db_hygiene_report.py \
            tests/test_performance_baseline.py \
            tests/test_local_mvp_audit.py \
            tests/test_source_health_actionability.py \
            tests/test_source_health_env_key_surfacing.py \
            tests/test_github_actions_ci.py

  frontend:
    name: frontend vitest + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next build
        env:
          # Disable telemetry; keep the build hermetic.
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
