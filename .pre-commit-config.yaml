# D3 fix: secret-detection pre-commit + lightweight hygiene checks.
#
# Run locally:
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
#
# CI mirrors these via .github/workflows/dep_audit.yml + the existing
# pytest workflow.

repos:
  - repo: local
    hooks:
      - id: secret-fixture-lint
        # Early guard (NOT a gitleaks substitute): rejects scanner-bait
        # fixtures — fake keys/REDACTED beside credential keywords — with
        # a fix-it message before gitleaks ever sees them. See SECURITY.md
        # "Secret fixture hygiene".
        name: secret fixture hygiene lint
        entry: python scripts/secret_fixture_lint.py
        language: system
        pass_filenames: false
      - id: security-gate-integrity
        # The gates themselves must not drift: verifies the gitleaks
        # pipeline (pinned CLI + checksum, explicit config, lint-first,
        # tree+commit scans, SARIF artifact, fail-closed) across all
        # workflow files. Stdlib-only, milliseconds.
        name: security gate integrity audit
        entry: python scripts/audit_security_gate_integrity.py
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        # Scan staged content for AWS keys, GCP creds, OAuth tokens,
        # generic API keys, and other high-entropy patterns.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
