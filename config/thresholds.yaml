scoring_weights:
  engagement:
    emotional_intensity: 0.20
    headline_extremity: 0.15
    narrative_recycling: 0.15
    virality_spike: 0.15
    curiosity_gap: 0.15
    evidence_density: 0.10
    source_credibility: 0.10
  evidence:
    primary_source_weight: 0.25
    source_credibility: 0.20
    confirmation_count: 0.20
    recency: 0.15
    cross_source_diversity: 0.10
    contradiction_penalty: 0.10
  durability:
    persistence: 0.25
    stress_survival: 0.25
    cross_source_confirmation: 0.20
    time_stability: 0.15
    contradiction_resistance: 0.15
thresholds:
  ignore_ems_high: 0.75
  ignore_eqs_low: 0.45
  watch_aps_min: 0.35
  validate_aps_min: 0.55
  paper_trade_aps_min: 0.70
  paper_trade_eqs_min: 0.65
  paper_trade_ds_min: 0.60
  paper_trade_ls_min: 0.50
  paper_trade_ems_max: 0.60
  paper_trade_efs_max: 0.50
  edge_threshold: 0.08
  simulated_stake: 100.0

# Daily five-model synthesis discovery / execution gates.
# These govern the Fresh Market Discovery Gate and the Candidate-vs-Executable
# split. They are advisory thresholds only — they NEVER authorize execution.
daily_discovery:
  cqs_min: 0.70            # Candidate Quality Score floor to be a BUY-CANDIDATE
  acqs_min: 0.60           # decay-adjusted CQS floor (CQS * exp(-lambda*d))
  eqs_min: 0.75            # Execution Quality Score floor to be EXECUTABLE
  fcs_min: 0.70            # Final Candidate Score floor in cross-model synthesis
  ers_min: 0.75            # Execution Readiness Score floor in synthesis
  watchlist_fcs_min: 0.55  # below cqs_min but worth watching
  source_health_min: 0.70  # live-data health floor for executable status
  why_today_min_for_executable: 0.70  # WHY_TODAY_SCORE floor for EXECUTABLE
  novelty_ratio_min: 0.30  # |T\Y| / |T| floor before STALE_DISCOVERY_WARNING
  minimum_novelty_ratio: 0.30  # alias of novelty_ratio_min (spec naming)
  min_new_ticker_count: 10 # target fresh tickers not seen yesterday
  minimum_new_tickers: 10  # alias of min_new_ticker_count (spec naming)
  memory_decay_lambda: 0.25  # exp(-lambda*d) candidate memory decay rate
  disagreement_low_max: 0.15   # normalized disagreement < this => low/clean
  disagreement_high_min: 0.35  # normalized disagreement >= this => high
  staleness_penalty:
    STALE_24H: 0.20
    STALE_48H: 0.35
    HISTORICAL_ONLY: 0.50

# Entry-quality gate — blocks "falling-knife" entries and over-extended buys.
# Computed per-ticker at buy-time from daily OHLCV. All numeric bounds are
# configurable; defaults are intentionally conservative.
# A name fails the gate when entry_quality_pass=false and is routed to
# BUY-CANDIDATE / NOT-EXECUTABLE (never erased from discovery).
entry_quality:
  enabled: true
  # Trend (regime) gates — required for "core" risk band.
  require_close_above_sma50: true
  require_sma50_rising: true
  require_close_above_sma200_for_core: true
  # Distance from SMA50: avoid both falling knives (well below) and stretched buys.
  dist_from_sma50_min: -0.02   # close must be within -2% of SMA50 or higher
  dist_from_sma50_max:  0.12   # ...and not more than +12% above (mean-reversion zone)
  # 20-day momentum percentile vs the day's scored universe.
  mom_20d_percentile_min: 0.40 # top 60% of names by 20d return
  # Relative strength vs local index (20d): require positive.
  rs_vs_index_min: 0.0
  # Distance from 52-week high — block buys clustered right at the high.
  extension_vs_52w_high_max: -0.02   # must be ≥ 2% below the 252-day high
  # ATR(14)/close band — filters chop + illiquid blowups.
  atr14_pct_min: 0.010
  atr14_pct_max: 0.060
  # Liquidity floor in local currency. Operator-overridable per market.
  adv_local_min: 5_000_000
  # Soft score weights (used to produce entry_quality_score ∈ [0,1] for ranking).
  # The hard pass/fail is independent of these weights.
  score_weights:
    trend_50: 0.20
    trend_200: 0.15
    dist_from_sma50: 0.15
    mom_20d: 0.20
    rs_vs_index: 0.15
    extension_vs_52w_high: 0.10
    atr14_pct: 0.05

# Daily portfolio diversification — TIEBREAKER, not a quota.
# Applied after entry-quality + composite ranking. Country/sector caps filter
# the already-passing list. We never inject a name to satisfy a min country
# count; if there aren't enough quality-passing candidates, we emit fewer picks.
portfolio_diversification:
  enabled: true
  max_picks_per_day: 10
  max_picks_per_country: 2
  max_picks_per_sector: 2
  # Aspirational visibility only — logged but never used to inject picks.
  target_distinct_countries: 5
  # 30-largest-GDP set, Russia excluded (sanctions / untradeable).
  country_eligibility:
    - US
    - CN
    - DE
    - JP
    - GB
    - IN
    - FR
    - IT
    - BR
    - CA
    - AU
    - MX
    - ES
    - KR
    - TR
    - ID
    - NL
    - SA
    - CH
    - PL
    - TW
    - IE
    - BE
    - SE
    - IL
    - AR
    - SG
    - AT
    - AE
