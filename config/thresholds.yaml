scoring_weights:
  engagement:
    emotional_intensity: 0.20
    headline_extremity: 0.15
    narrative_recycling: 0.15
    virality_spike: 0.15
    curiosity_gap: 0.15
    evidence_density: 0.10
    source_credibility: 0.10
  evidence:
    primary_source_weight: 0.25
    source_credibility: 0.20
    confirmation_count: 0.20
    recency: 0.15
    cross_source_diversity: 0.10
    contradiction_penalty: 0.10
  durability:
    persistence: 0.25
    stress_survival: 0.25
    cross_source_confirmation: 0.20
    time_stability: 0.15
    contradiction_resistance: 0.15
thresholds:
  ignore_ems_high: 0.75
  ignore_eqs_low: 0.45
  watch_aps_min: 0.35
  validate_aps_min: 0.55
  paper_trade_aps_min: 0.70
  paper_trade_eqs_min: 0.65
  paper_trade_ds_min: 0.60
  paper_trade_ls_min: 0.50
  paper_trade_ems_max: 0.60
  paper_trade_efs_max: 0.50
  edge_threshold: 0.08
  simulated_stake: 100.0

# Daily five-model synthesis discovery / execution gates.
# These govern the Fresh Market Discovery Gate and the Candidate-vs-Executable
# split. They are advisory thresholds only — they NEVER authorize execution.
daily_discovery:
  cqs_min: 0.70            # Candidate Quality Score floor to be a BUY-CANDIDATE
  acqs_min: 0.60           # decay-adjusted CQS floor (CQS * exp(-lambda*d))
  eqs_min: 0.75            # Execution Quality Score floor to be EXECUTABLE
  fcs_min: 0.70            # Final Candidate Score floor in cross-model synthesis
  ers_min: 0.75            # Execution Readiness Score floor in synthesis
  watchlist_fcs_min: 0.55  # below cqs_min but worth watching
  source_health_min: 0.70  # live-data health floor for executable status
  why_today_min_for_executable: 0.70  # WHY_TODAY_SCORE floor for EXECUTABLE
  novelty_ratio_min: 0.30  # |T\Y| / |T| floor before STALE_DISCOVERY_WARNING
  minimum_novelty_ratio: 0.30  # alias of novelty_ratio_min (spec naming)
  min_new_ticker_count: 10 # target fresh tickers not seen yesterday
  minimum_new_tickers: 10  # alias of min_new_ticker_count (spec naming)
  memory_decay_lambda: 0.25  # exp(-lambda*d) candidate memory decay rate
  disagreement_low_max: 0.15   # normalized disagreement < this => low/clean
  disagreement_high_min: 0.35  # normalized disagreement >= this => high
  staleness_penalty:
    STALE_24H: 0.20
    STALE_48H: 0.35
    HISTORICAL_ONLY: 0.50

# Discovery / Execution / Survival three-lane mode model.
# Single source of truth for the mode_state gates, why-today tiers, BUY_SCORE
# composition, phantom set, and exit-debt config. These are ADVISORY thresholds
# only — they gate discovery-surface labelling and execution PERMISSION, they
# NEVER authorize execution. BUY / PROBE_BUY remain advisory paper-signal
# classifications; human execution is always required and the execution gate
# stays LOCKED.
discovery_execution:
  # Execution-permission gates (block BUY, never block discovery).
  min_holdings_price_coverage_for_execution: 0.80
  min_candidate_price_coverage_for_execution: 0.80
  # Price validity: sources that can never count as a valid/live price.
  non_executable_price_sources:
    - STATIC_FALLBACK
    - STATIC_UNIVERSE_FALLBACK
    - UNVERIFIED
    - MOCK_ONLY
    - UNKNOWN
  # WHY_TODAY tier boundaries (tiered classification, not a single hard floor).
  why_today_noise_max: 0.40       # < this => NOISE_OR_STALE
  why_today_discovery_min: 0.55   # >= this => VALID_DISCOVERY
  why_today_watchlist_min: 0.65   # >= this => STRONG_WATCHLIST
  why_today_probe_min: 0.73       # >= this => PROBE_CANDIDATE (if exec gates pass)
  why_today_buy_min: 0.80         # >= this => HIGH_CONVICTION (if exec gates pass)
  # BUY_SCORE classification thresholds.
  buy_score_discovery_min: 0.55
  buy_score_watchlist_min: 0.65
  buy_score_probe_min: 0.73
  buy_score_buy_min: 0.80
  # BUY_SCORE weights (must sum to 1.0). Each component clamped to [0,1].
  buy_score_weights:
    why_today_score: 0.30
    price_confirmation: 0.25
    source_quality: 0.20
    cross_model_agreement: 0.15
    portfolio_fit: 0.10
  # Per-candidate proof floors required for PROBE_BUY / BUY (in addition to
  # execution_allowed=true and BUY_SCORE thresholds).
  probe_price_confirmation_min: 0.60
  probe_volume_confirmation_min: 0.50
  probe_source_quality_min: 0.60
  buy_price_confirmation_min: 0.70
  buy_volume_confirmation_min: 0.60
  buy_source_quality_min: 0.70
  buy_portfolio_fit_min: 0.60
  # Exit-debt normalization.
  exit_debt_d_max: 5
  # Phantom / quarantine baseline. Unioned with the runtime hard-override file
  # data/daily_payload/do_not_treat_as_open.json (which always wins for OPEN
  # truth). ZIM is phantom-adjacent by config baseline.
  default_phantom_tickers:
    - GLD
    - UNG
    - TIP
    - TLT
    - FCG
    - ZIM
  # Trade-state vocabularies for reconciliation / phantom / exit-debt logic.
  open_like_states:
    - OPEN
    - OPEN_RECONCILED
    - OPEN_LIKE
    - EXIT_PENDING
    - PARTIAL
    - HOLD
  closed_states:
    - CLOSED
    - STOP_CLOSED
    - CLOSE_TRADE_SYNCED
    - CLOSED_RECONCILED
    - SOLD
    - EXITED
