# Minimum viable fresh daily universe (set U_static).
#
# Operator-editable mirror of scripts/minimum_daily_universe.py:DEFAULT_UNIVERSE.
# When this file is present and valid it is merged over the embedded defaults;
# if it is missing or unparseable the embedded universe is used so discovery is
# never starved.
#
# These names are DISCOVERY CANDIDATES ONLY. Universe membership NEVER implies
# portfolio ownership. Portfolio-management permission comes solely from the
# Portfolio Truth Gate: H = V \ (C ∪ S ∪ D). A ticker can be in U_static and
# still be DO_NOT_TREAT_AS_OPEN / CLOSED_OR_SOLD (e.g. GLD, TLT, TIP).
#
# Per-ticker required metadata (backfilled from bucket defaults when omitted):
#   ticker, name, bucket, market, country, asset_type, default_risk_band, notes

