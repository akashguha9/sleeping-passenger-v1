external_adapters:
  poly_data:
    enabled: false
    mode: csv_sidecar
    path_env: POLY_DATA_PATH
    fallback_path: external/poly_data
    max_rows: 5000
    real_execution_allowed: false

  kronos:
    enabled: false
    mode: optional_python
    lazy_import: true
    mock_mode: true
    real_execution_allowed: false

  tradingagents:
    enabled: false
    mode: mock
    dry_run: true
    allow_api_keys_in_tests: false
    sanitize_actions: true
    force_paper_only: true
    real_execution_allowed: false

  trendradar:
    enabled: false
    mode: output_sidecar
    path_env: TRENDRADAR_OUTPUT_PATH
    fallback_path: external/trendradar/output
    max_items: 1000
    real_execution_allowed: false

  apollo:
    enabled: true
    mode: internal_doctrine
    chaos_threshold: 0.75
    durability_threshold: 0.65
    evidence_quality_threshold: 0.60
    minimum_source_count: 2
    real_execution_allowed: false

  fincept_terminal:
    enabled: false
    mode: exported_analytics_sidecar
    path_env: FINCEPT_EXPORT_PATH
    fallback_path: external/fincept/exports
    real_execution_allowed: false

# Global flag for the EXTERNAL_ADVISORY_EVIDENCE_ENRICHMENT stage that wires the
# adapter registry + router into daily synthesis.  Disabled-and-safe by default:
# when disabled the stage performs no adapter calls and has zero decision impact.
# Even when enabled, external evidence is advisory-context-only and bounded by
# the asymmetric score-delta caps below (stronger as a risk reducer than booster).
external_advisory_evidence:
  enabled: false
  decision_impact: ADVISORY_CONTEXT_ONLY
  max_positive_score_delta: 0.50
  max_negative_score_delta: -1.00
  require_human_review: true
  real_execution_allowed: false
  execution_permission: WATCH_ONLY
