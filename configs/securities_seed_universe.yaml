# Securities seed universe — the active/tracked tickers the MVP must resolve.
# Advisory-only static metadata. No live fetch. No execution. No broker API.
#
# Each entry: symbol (canonical, bare), exchange (code), country (ISO-2),
# currency (ISO), name, asset_type. Jurisdiction is derived from country.
# Duplicate bare symbols (e.g. AIR on EPA and ETR) are de-duplicated by the
# loader keeping the first occurrence; both are REST_OF_WORLD so leverage
# governance is unaffected.

