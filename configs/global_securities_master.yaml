# Global Securities Master — top 50 major economies and major exchanges
# Advisory-only. No execution. No broker API. Human review required.
#
# advisory_status: ADVISORY_ONLY
# execution_gate: LOCKED
# human_review_required: true
# ai_execution_count: 0
# broker_api_called: false
# broker_order_id: NONE
#
# Each entry:
#   canonical_symbol: The primary symbol stored in global_securities (uppercase).
#   yahoo_symbol:     The yfinance ticker string (may differ from canonical).
#   exchange_code:    Short exchange identifier.
#   exchange_name:    Human-readable exchange name.
#   country:          ISO 3166-1 alpha-2 country code.
#   economy_rank:     Approximate GDP rank (1 = largest).
#   asset_type:       EQUITY | ETF | INDEX | CRYPTO | BOND
#   name:             Human-readable security name.
#
# Symbols are discovered/backfilled via:
#   python scripts/global_security_master_discovery.py --write
#   python scripts/backfill_global_ohlcv.py --symbols <SYM> --period max --interval 1d --write

exchanges:
