# Global Securities Master — top 50 major economies and major exchanges
# Advisory-only. No execution. No broker API. Human review required.
#
# advisory_status: ADVISORY_ONLY
# execution_gate: LOCKED
# human_review_required: true
# ai_execution_count: 0
# broker_api_called: false
# broker_order_id: NONE
#
# SEED COVERAGE ONLY — this is a deterministic, manually-curated seed of the
# largest names per major economy. It is NOT a complete market universe and
# must never be presented as full coverage. Symbols are discovered/backfilled
# incrementally; absence of a name here means "not yet seeded", not "delisted".
#
# Each entry:
#   canonical_symbol: The primary symbol stored in global_securities (uppercase).
#   yahoo_symbol:     The yfinance ticker string (may differ from canonical).
#   local_ticker:     Native exchange ticker if it differs from yahoo_symbol.
#   exchange_code:    Short exchange identifier.
#   exchange_name:    Human-readable exchange name.
#   country:          ISO 3166-1 alpha-2 country code.
#   currency:         ISO 4217 trading currency (advisory only).
#   economy_rank:     Approximate GDP rank (1 = largest).
#   asset_type:       EQUITY | ETF | INDEX | CRYPTO | BOND
#   name:             Human-readable security name.
#   company_name:     Optional issuer name when distinct from `name`.
#   sector:           Coarse GICS-style sector (advisory only).
#   aliases:          Alternate names/tickers the entity-ticker mapper indexes.
#   is_adr:           true if this row is a US-listed proxy (ADR/ETF) for a
#                     foreign issuer.
#   adr_ticker:       US-listed proxy symbol for this local listing, if any.
#   mapping_priority: Tie-break priority when several rows could match
#                     (lower number = preferred). Local listings should rank
#                     ahead of US proxies.
#
# Symbols are discovered/backfilled via:
#   python scripts/global_security_master_discovery.py --write
#   python scripts/backfill_global_ohlcv.py --symbols <SYM> --period max --interval 1d --write

