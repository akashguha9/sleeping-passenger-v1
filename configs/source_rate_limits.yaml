# Rate limits for Global Signal Fabric source loaders (Phase 2).
# All sources are read-only observers. These limits prevent accidental hammering.

defaults:
  requests_per_minute: 10
  requests_per_hour: 100
  burst_limit: 3
  backoff_seconds: 1.0
  retry_attempts: 2

polymarket:
  requests_per_minute: 30
  requests_per_hour: 500
  burst_limit: 5
  backoff_seconds: 0.5

