# Global Signal Fabric — Phase 2 source loader configuration
# All sources are READ-ONLY. No source may place, modify, or execute orders.
# advisory_status: ADVISORY_ONLY applies to all outputs from every source.

advisory_contract:
  advisory_status: ADVISORY_ONLY
  human_review_required: true
  execution_gate: LOCKED

polymarket:
  enabled: true
  requires_key: false
  gamma_base_url: "https://gamma-api.polymarket.com"
  data_base_url: "https://data-api.polymarket.com"
  timeout_seconds: 10
  max_markets: 20
  read_only: true
  note: "Public market/data endpoints only. No authenticated trading endpoints."

gdelt:
  enabled: true
  requires_key: false
  base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  timeout_seconds: 15
  max_records: 25
  default_query: "market OR economy OR inflation"
  read_only: true

sec_edgar:
  enabled: true
  requires_key: true
  key_env_var: SEC_USER_AGENT
  base_url: "https://data.sec.gov"
  timeout_seconds: 15
  max_filings: 10
  read_only: true
  note: "SEC requires identifying User-Agent per fair-access policy."

etherscan:
  enabled: true
  requires_key: true
  key_env_var: ETHERSCAN_API_KEY
  base_url: "https://api.etherscan.io/api"
  timeout_seconds: 15
  max_records: 25
  read_only: true

market_data:
  enabled: true
  requires_key: false
  provider: yfinance
  default_tickers: ["SPY", "QQQ", "GLD", "TLT", "IEF", "USO"]
  default_period: "5d"
  default_interval: "1d"
  read_only: true

broker_csv:
  enabled: true
  requires_key: false
  import_mode: manual_file_only
  no_broker_api: true
  read_only: true
  note: "Manual CSV import only. No broker API connection of any kind."

newsapi:
  enabled: true
  requires_key: true
  key_env_var: NEWS_API_KEY
  base_url: "https://newsapi.org/v2/everything"
  timeout_seconds: 15
  max_articles: 20
  read_only: true

event_registry:
  enabled: true
  requires_key: true
  key_env_var: EVENT_REGISTRY_API_KEY
  base_url: "https://eventregistry.org/api/v1/article/getArticles"
  timeout_seconds: 15
  max_articles: 20
  read_only: true

grok_xai:
  enabled: true
  requires_key: true
  key_env_var: XAI_API_KEY
  base_url: "https://api.x.ai/v1/chat/completions"
  model: "grok-beta"
  timeout_seconds: 30
  read_only: true
  advisory_system_prompt: >
    You are a read-only market observation assistant.
    Never recommend actions. All outputs are advisory only.

india_nse_bse:
  enabled: true
  requires_key: false
  nse_base_url: "https://www.nseindia.com/api"
  timeout_seconds: 15
  read_only: true

rbi_sebi:
  enabled: true
  requires_key: false
  rbi_base_url: "https://www.rbi.org.in"
  sebi_base_url: "https://www.sebi.gov.in"
  timeout_seconds: 15
  read_only: true

eu_esef:
  enabled: true
  requires_key: false
  base_url: "https://filings.efrag.org/api"
  timeout_seconds: 15
  max_filings: 10
  read_only: true

uk_companies_house:
  enabled: true
  requires_key: true
  key_env_var: UK_COMPANIES_HOUSE_API_KEY
  base_url: "https://api.company-information.service.gov.uk"
  timeout_seconds: 15
  max_results: 10
  read_only: true

japan_edinet:
  enabled: true
  requires_key: true
  key_env_var: EDINET_API_KEY
  base_url: "https://disclosure.edinet-fsa.go.jp/api/v1"
  timeout_seconds: 15
  max_docs: 10
  read_only: true

singapore_acra_sgx:
  enabled: true
  requires_key: false
  sgx_base_url: "https://api.sgx.com"
  timeout_seconds: 15
  max_items: 20
  read_only: true

china_disclosure:
  enabled: true
  requires_key: false
  sse_url: "http://query.sse.com.cn"
  szse_url: "http://www.szse.cn"
  timeout_seconds: 15
  max_records: 20
  read_only: true

solscan:
  enabled: true
  requires_key: true
  key_env_var: SOLSCAN_API_KEY
  base_url: "https://pro-api.solscan.io/v2.0"
  timeout_seconds: 15
  max_records: 20
  read_only: true

evm_chain:
  enabled: true
  requires_key: true
  key_env_var: EVM_RPC_URL
  timeout_seconds: 15
  default_block_count: 5
  supported_chains:
    - ethereum
    - polygon
    - arbitrum
    - optimism
    - base
  read_only: true
