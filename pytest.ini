[pytest]
addopts = -ra -p no:cacheprovider
testpaths = tests
norecursedirs =
    _tmp_runtime
    .pytest_tmp
    .pytest_cache
    pytest-cache-files-*
    tests/fixtures/external_adapters/_generated_poly_data
    tests/fixtures/external_adapters/_generated_*
    chronology
    __pycache__
filterwarnings =
    ignore::DeprecationWarning
