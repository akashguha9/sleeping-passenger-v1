[pytest]
addopts = -ra -p no:cacheprovider
testpaths = tests
norecursedirs =
    _tmp_runtime
    .pytest_tmp
    .pytest_cache
    pytest-cache-files-*
    tests/fixtures/external_adapters/_generated_poly_data
    tests/fixtures/external_adapters/_generated_*
    chronology
    __pycache__
filterwarnings =
    ignore::DeprecationWarning
# Sprint marker taxonomy — proof_loop_hardening_sprint, Phase 11.
# Tests should be classifiable as exactly one of these.  Existing tests
# that pre-date the sprint are classified by filename heuristic in
# scripts/test_inventory_report.py until they are migrated.
markers =
    safety_floor: protects advisory-only / no-execution / no-secrets / no-broker invariants
    reliability: protects freshness / persistence / scheduler / watchdog / provider failures / retry / backup-restore
    calibration: protects calibration corpus / Brier / ECE / MCE / log loss / N_real / fixture exclusion
    moltbook: protects reconciliation learning / contamination rejection / idempotency / open-trade blocking
    frontend_truth: protects UI truthfulness (advisory-only, mock/live/stale/degraded, no execution language)
    cosmetic: snapshot / shape tests that do not protect a major invariant
