# Requires Python >= 3.12: the suite/runtime use PEP 701 f-strings
# (backslash inside f-string expressions), a SyntaxError on 3.11. CI runs 3.13.
[pytest]
addopts = -ra -p no:cacheprovider
testpaths = tests
norecursedirs =
    _tmp_runtime
    .pytest_tmp
    .pytest_cache
    pytest-cache-files-*
    tests/fixtures/external_adapters/_generated_poly_data
    tests/fixtures/external_adapters/_generated_*
    chronology
    __pycache__
filterwarnings =
    ignore::DeprecationWarning
